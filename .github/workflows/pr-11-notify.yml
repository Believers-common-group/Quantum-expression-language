name: PR 11 review and merge notifications

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  notify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 11 }}
    runs-on: ubuntu-latest
    steps:
      - name: Record and forward notification
        id: record
        uses: actions/github-script@v7
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.PR11_SLACK_WEBHOOK_URL }}
          NOTION_TOKEN: ${{ secrets.PR11_NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.PR11_NOTION_PARENT_PAGE_ID || '3a323c8ea59d819faa8af8f848cd25a0' }}
          DROPBOX_ACCESS_TOKEN: ${{ secrets.PR11_DROPBOX_ACCESS_TOKEN }}
          DROPBOX_PATH: ${{ vars.PR11_DROPBOX_PATH }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require("fs");
            const path = require("path");
            const { owner, repo } = context.repo;
            core.setOutput("artifact_ready", "false");

            let pr = context.payload.pull_request;
            if (!pr) {
              const response = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: 11,
              });
              pr = response.data;
            }

            if (pr.number !== 11) {
              core.info(`Ignoring PR #${pr.number}.`);
              return;
            }

            const action = context.payload.action || "manual";
            const review = context.payload.review || null;
            const merged = context.eventName === "pull_request" && action === "closed" && Boolean(pr.merged);

            if (context.eventName === "pull_request" && !merged) {
              core.info("PR #11 was closed without merge; no notification was emitted.");
              return;
            }

            const actor = review?.user?.login || context.actor;
            const eventLabel = review
              ? `review ${action}: ${review.state}`
              : merged
                ? "merged"
                : "manual status check";
            const timestamp = new Date().toISOString();
            const prUrl = pr.html_url;
            const reviewUrl = review?.html_url || "";
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const commitUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/commit/${pr.head.sha}`;
            const auditIssueUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/issues/13`;
            const workflowUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/workflows/pr-11-notify.yml`;
            const artifactName = `pr11-gpt-cache-${process.env.GITHUB_RUN_ID}`;

            const notificationRecord = {
              schema: "org.believerscommon.github.pr-notification.v1",
              purpose: "sanitized-gpt-handoff-cache",
              repository: process.env.GITHUB_REPOSITORY,
              pull_request: 11,
              event: context.eventName,
              action,
              event_label: eventLabel,
              review_state: review?.state || null,
              actor,
              recorded_at: timestamp,
              head_sha: pr.head.sha,
              base_sha: pr.base.sha,
              merged,
              privacy: {
                review_body_included: false,
                secrets_included: false,
                raw_github_event_included: false,
              },
              urls: {
                pull_request: prUrl,
                review: reviewUrl || null,
                workflow_run: runUrl,
                workflow_definition: workflowUrl,
                head_commit: commitUrl,
                github_audit_issue: auditIssueUrl,
              },
              cache: {
                artifact_name: artifactName,
                retention_days: 90,
                interpretation: "Event metadata for future GPT-assisted review. It is not OpenAI internal cache or a substitute for GitHub source evidence.",
              },
            };

            const gptCacheMarkdown = [
              `# GPT handoff cache — PR #11 ${eventLabel}`,
              "",
              `- Repository: ${process.env.GITHUB_REPOSITORY}`,
              "- Pull request: #11",
              `- Actor: @${actor}`,
              `- Event: ${context.eventName}/${action}`,
              `- Review state: ${review?.state || "not-applicable"}`,
              `- Recorded: ${timestamp}`,
              `- Head SHA: ${pr.head.sha}`,
              `- Merged: ${merged}`,
              "",
              "## URLs",
              "",
              `- PR: ${prUrl}`,
              `- Review: ${reviewUrl || "not-applicable"}`,
              `- Workflow run and logs: ${runUrl}`,
              `- Head commit: ${commitUrl}`,
              `- GitHub audit issue: ${auditIssueUrl}`,
              "",
              "## Trust boundary",
              "",
              "This capsule contains sanitized event metadata only. It excludes review-body text, raw webhook payloads, secrets, customer information, and confidential documents. It is a user-controlled handoff cache, not an export of OpenAI or ChatGPT internal cache or system logs.",
              "",
            ].join("\n");

            const artifactDirectory = path.join(process.cwd(), "notification-artifacts");
            fs.mkdirSync(artifactDirectory, { recursive: true });
            fs.writeFileSync(
              path.join(artifactDirectory, "pr11-notification.json"),
              `${JSON.stringify(notificationRecord, null, 2)}\n`,
              "utf8",
            );
            fs.writeFileSync(
              path.join(artifactDirectory, "gpt-cache.md"),
              gptCacheMarkdown,
              "utf8",
            );
            core.setOutput("artifact_ready", "true");

            const urlLines = [
              `- [PR #11](${prUrl})`,
              reviewUrl ? `- [Review](${reviewUrl})` : null,
              `- [Workflow run and logs](${runUrl})`,
              `- [Head commit](${commitUrl})`,
              `- GPT cache artifact: \`${artifactName}\``,
            ].filter(Boolean);

            const issueComment = [
              `### PR #11 ${eventLabel}`,
              "",
              `- Actor: @${actor}`,
              `- Event: \`${context.eventName}\` / \`${action}\``,
              `- Recorded: ${timestamp}`,
              ...urlLines,
              "",
              "> This notification records review or merge state. It does not approve, merge, or alter the pull request.",
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: 13,
              body: issueComment,
            });

            await core.summary
              .addHeading(`PR #11 ${eventLabel}`)
              .addRaw(issueComment)
              .write();

            async function sendJson(url, body, headers, destination) {
              const response = await fetch(url, {
                method: "POST",
                headers,
                body: JSON.stringify(body),
              });
              if (!response.ok) {
                const responseText = await response.text();
                throw new Error(`${destination} notification failed (${response.status}): ${responseText.slice(0, 500)}`);
              }
              core.info(`${destination} notification sent.`);
            }

            const slackWebhook = process.env.SLACK_WEBHOOK_URL;
            if (slackWebhook) {
              const slackLinks = [
                `<${prUrl}|PR #11>`,
                reviewUrl ? `<${reviewUrl}|Review>` : null,
                `<${runUrl}|Workflow run and logs>`,
                `<${commitUrl}|Head commit>`,
                `<${auditIssueUrl}|Audit issue>`,
              ].filter(Boolean).join(" | ");

              await sendJson(
                slackWebhook,
                {
                  text: `PR #11 ${eventLabel} by @${actor}: ${prUrl}`,
                  blocks: [
                    {
                      type: "section",
                      text: {
                        type: "mrkdwn",
                        text: `*PR #11 ${eventLabel}*\nActor: @${actor}\nGPT cache: ${artifactName}\n${slackLinks}`,
                      },
                    },
                  ],
                },
                { "Content-Type": "application/json" },
                "Slack",
              );
            } else {
              core.info("Slack destination is not configured; skipping.");
            }

            const notionToken = process.env.NOTION_TOKEN;
            const notionParentPageId = process.env.NOTION_PARENT_PAGE_ID;
            if (notionToken && notionParentPageId) {
              const children = [
                {
                  object: "block",
                  type: "paragraph",
                  paragraph: {
                    rich_text: [
                      {
                        type: "text",
                        text: { content: `Actor: @${actor} | Event: ${context.eventName}/${action} | Recorded: ${timestamp}` },
                      },
                    ],
                  },
                },
                {
                  object: "block",
                  type: "paragraph",
                  paragraph: {
                    rich_text: [
                      {
                        type: "text",
                        text: { content: `GPT cache artifact: ${artifactName}. Raw workflow logs remain available through the workflow-run URL.` },
                      },
                    ],
                  },
                },
                { object: "block", type: "bookmark", bookmark: { url: prUrl } },
                ...(reviewUrl ? [{ object: "block", type: "bookmark", bookmark: { url: reviewUrl } }] : []),
                { object: "block", type: "bookmark", bookmark: { url: runUrl } },
                { object: "block", type: "bookmark", bookmark: { url: commitUrl } },
                { object: "block", type: "bookmark", bookmark: { url: auditIssueUrl } },
              ];

              await sendJson(
                "https://api.notion.com/v1/pages",
                {
                  parent: { page_id: notionParentPageId },
                  properties: {
                    title: {
                      type: "title",
                      title: [{ type: "text", text: { content: `PR #11 ${eventLabel}` } }],
                    },
                  },
                  children,
                },
                {
                  Authorization: `Bearer ${notionToken}`,
                  "Content-Type": "application/json",
                  "Notion-Version": "2022-06-28",
                },
                "Notion",
              );
            } else {
              core.info("Notion destination is not fully configured; skipping.");
            }

            async function uploadDropbox(dropboxFile, content) {
              const response = await fetch("https://content.dropboxapi.com/2/files/upload", {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${process.env.DROPBOX_ACCESS_TOKEN}`,
                  "Content-Type": "application/octet-stream",
                  "Dropbox-API-Arg": JSON.stringify({
                    path: dropboxFile,
                    mode: "add",
                    autorename: true,
                    mute: false,
                    strict_conflict: false,
                  }),
                },
                body: content,
              });
              if (!response.ok) {
                const responseText = await response.text();
                throw new Error(`Dropbox notification failed (${response.status}): ${responseText.slice(0, 500)}`);
              }
              core.info(`Dropbox notification uploaded to ${dropboxFile}.`);
            }

            const dropboxToken = process.env.DROPBOX_ACCESS_TOKEN;
            if (dropboxToken) {
              const folder = (process.env.DROPBOX_PATH || "/QEL/PR-11-notifications").replace(/\/$/, "");
              const safeTimestamp = timestamp.replace(/[:.]/g, "-");
              const stem = `${folder}/${safeTimestamp}-${context.eventName}-${action}`;
              await uploadDropbox(`${stem}.json`, `${JSON.stringify(notificationRecord, null, 2)}\n`);
              await uploadDropbox(`${stem}-gpt-cache.md`, gptCacheMarkdown);
            } else {
              core.info("Dropbox destination is not configured; skipping.");
            }

      - name: Upload GPT handoff cache
        if: ${{ steps.record.outputs.artifact_ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: pr11-gpt-cache-${{ github.run_id }}
          path: notification-artifacts/
          if-no-files-found: error
          retention-days: 90
